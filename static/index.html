<!DOCTYPE html>
<html lang="en" data-theme="lothal" data-parallax="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <script>
    try {
      const savedTheme = localStorage.getItem("speak-theme");
      if (savedTheme === "arcade" || savedTheme === "lothal") {
        document.documentElement.dataset.theme = savedTheme;
      }
      const savedParallax = localStorage.getItem("speak-parallax");
      if (savedParallax === "off" || savedParallax === "on") {
        document.documentElement.dataset.parallax = savedParallax;
      }
    } catch (_) {}
  </script>
  <title>speak</title>
  <style>
    :root {
      color-scheme: dark;
      --scroll-y: 0px;
      --mouse-x: 0px;
      --mouse-y: 0px;

      /* Theme 1: Lothal — Deep Slate & Distinct Component Palette */
      --bg-base: #080b12;
      --bg-panel: rgba(15, 21, 35, 0.86);
      --bg-elevated: #162035;
      --bg-hud: #05080f;
      --text-main: #ecf3f8;
      --text-muted: #8aa0b8;
      --text-dim: #49657a;
      --border-base: rgba(255, 255, 255, 0.1);

      /* Component Palette (Lothal) */
      --c1-voice: #00f5d4;     /* 1. Voice & Options: Cyan */
      --c2-source: #ffbe0b;    /* 2. Source & Synthesize: Amber Gold */
      --c3-player: #38d9a9;    /* 3. Player: Emerald */
      --c4-queue: #4dabf7;     /* 4. Queue: Sky Blue */
      --c5-console: #b197fc;   /* 5. Console Drawer: Lavender */
      --c3-queue: var(--c3-player);
      --c4-terminal: var(--c5-console);

      --status-ok: #51cf66;
      --status-err: #ff6b6b;
      --status-warn: #fcc419;

      --card-radius: 10px;
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      --glow-strength: 0px;

      --font-prose: "Atkinson Hyperlegible", "Lexend", "OpenDyslexic Nerd Font", system-ui, -apple-system, sans-serif;
      --font-mono: "OpenDyslexicMono Nerd Font", "OpenDyslexic Nerd Font", ui-monospace, "SF Mono", Menlo, monospace;
    }

    /* Theme 2: 1984 Arcade — High-Contrast CRT Vector Cabinet */
    :root[data-theme="arcade"] {
      --bg-base: #06010d;
      --bg-panel: rgba(18, 5, 36, 0.88);
      --bg-elevated: #220a45;
      --bg-hud: #04000a;
      --text-main: #fff5fc;
      --text-muted: #c896ff;
      --text-dim: #6f3b9e;
      --border-base: rgba(255, 42, 133, 0.28);

      /* Component Palette (1984 Arcade) */
      --c1-voice: #00f0ff;     /* 1. Voice & Options: Vector Cyan */
      --c2-source: #ffe600;    /* 2. Source & Synthesize: Laser Yellow */
      --c3-player: #00ff66;    /* 3. Player: Phosphor Green */
      --c4-queue: #00e5ff;     /* 4. Queue: Electric Cyan */
      --c5-console: #ff2a85;   /* 5. Console Drawer: Neon Magenta */
      --c3-queue: var(--c3-player);
      --c4-terminal: var(--c5-console);

      --status-ok: #00ff66;
      --status-err: #ff0055;
      --status-warn: #ffe600;

      --card-radius: 6px;
      --card-shadow: 0 0 18px rgba(0, 0, 0, 0.7);
      --glow-strength: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-prose);
      font-size: 1rem;
      line-height: 1.4;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    /* Subtle CRT scanline overlay in Arcade theme */
    :root[data-theme="arcade"] body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.2) 0px,
        rgba(0, 0, 0, 0.2) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    /* ── Layered Parallax Backdrop ──────────────────────────────────── */
    .parallax-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    :root[data-parallax="off"] .parallax-stage {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .parallax-layer {
        transform: none !important;
      }
    }

    .parallax-layer {
      position: absolute;
      inset: -15%;
      will-change: transform;
      transition: transform 0.08s linear;
    }

    .parallax-bg {
      transform: translate3d(
        calc(var(--mouse-x) * -0.015),
        calc(var(--scroll-y) * -0.14 + var(--mouse-y) * -0.015),
        0
      );
      background-image:
        radial-gradient(circle at 18% 20%, color-mix(in srgb, var(--c1-voice) 12%, transparent) 0%, transparent 40%),
        radial-gradient(circle at 82% 35%, color-mix(in srgb, var(--c2-source) 10%, transparent) 0%, transparent 38%),
        radial-gradient(circle at 30% 78%, color-mix(in srgb, var(--c3-queue) 11%, transparent) 0%, transparent 42%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }

    .parallax-mid {
      transform: translate3d(
        calc(var(--mouse-x) * 0.03),
        calc(var(--scroll-y) * -0.32 + var(--mouse-y) * 0.03),
        0
      );
    }

    .geo-shape {
      position: absolute;
      opacity: 0.14;
      border: 2px solid currentColor;
    }

    .geo-1 {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      color: var(--c1-voice);
      top: 14%;
      left: 6%;
    }

    .geo-2 {
      width: 140px;
      height: 140px;
      transform: rotate(22deg);
      border-radius: 12px;
      color: var(--c2-source);
      top: 42%;
      right: 7%;
    }

    .geo-3 {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      color: var(--c3-queue);
      bottom: 12%;
      left: 48%;
    }

    /* ── Compact Sticky Header Bar ──────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background-color: color-mix(in srgb, var(--bg-base) 82%, transparent);
      border-bottom: 1px solid var(--border-base);
      padding: 0.55rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .app-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--c1-voice);
      margin: 0;
      letter-spacing: 0.02em;
    }

    .app-version {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      border: 1px solid var(--border-base);
      padding: 0.1rem 0.4rem;
      border-radius: 99px;
    }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Compact Select & Button Primitives (16px font prevents iOS zoom) */
    select,
    input[type="text"],
    textarea,
    button {
      font-family: var(--font-prose);
      font-size: 1rem;
      color: var(--text-main);
      background-color: var(--bg-hud);
      border: 1px solid var(--border-base);
      border-radius: 7px;
      min-height: 42px;
      padding: 0.4rem 0.65rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease, background-color 0.15s ease;
    }

    select {
      cursor: pointer;
      padding-right: 1.6rem;
    }

    .select-mini {
      min-height: 36px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      padding: 0.25rem 0.5rem;
      background-color: var(--bg-elevated);
    }

    .btn-mini {
      min-height: 34px;
      padding: 0.22rem 0.55rem;
      font-size: 0.8rem;
      font-family: var(--font-mono);
      background-color: var(--bg-elevated);
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }

    .btn-mini:hover:not(:disabled) {
      border-color: var(--text-muted);
    }

    .btn-mini[aria-pressed="true"] {
      border-color: var(--c1-voice);
      color: var(--c1-voice);
    }

    /* ── Main Layout Grid (1-Col, 2-Col, 3-Col Responsive System) ─── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0.85rem;
      display: grid;
      gap: 0.85rem;
      align-items: start;
      /* Default 1-Column Layout (Mobile / Narrow Window < 860px) */
      grid-template-columns: 1fr;
      grid-template-areas:
        "form"
        "player"
        "queue"
        "console";
    }

    .col-form {
      grid-area: form;
    }

    .col-player {
      grid-area: player;
    }

    .col-queue {
      grid-area: queue;
    }

    .col-console {
      grid-area: console;
      min-width: 0;
    }

    .col-stack {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-width: 0;
    }

    /* 2-Column Layout (Tablet / Medium Window: 860px to 1199px) */
    @media (min-width: 860px) and (max-width: 1199px) {
      main {
        grid-template-columns: 0.95fr 1.15fr;
        grid-template-areas:
          "form    player"
          "form    queue"
          "console console";
      }
    }

    /* 3-Column Layout (Wide Window: >= 1200px) */
    @media (min-width: 1200px) {
      main {
        grid-template-columns: 0.9fr 1.1fr 1fr;
        grid-template-areas:
          "form    player   queue"
          "console console  console";
      }
    }

    @media (max-width: 859px) {
      main {
        padding: 0.65rem;
        gap: 0.65rem;
      }
      .col-stack {
        gap: 0.65rem;
      }
      header {
        padding: 0.45rem 0.65rem;
      }
      .app-version {
        display: none;
      }
    }

    /* ── Color-Coded Component Cards ────────────────────────────────── */
    .comp-card {
      --comp-color: var(--c1-voice);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--comp-color) 7%, transparent) 0%, transparent 60%),
        var(--bg-panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid color-mix(in srgb, var(--comp-color) 38%, transparent);
      border-left: 4px solid var(--comp-color);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 0.85rem 0.95rem;
    }

    .comp-1 { --comp-color: var(--c1-voice); }
    .comp-2 { --comp-color: var(--c2-source); }
    .comp-3, .comp-player { --comp-color: var(--c3-player); }
    .comp-queue, .comp-4 { --comp-color: var(--c4-queue); }
    .comp-terminal, .comp-console { --comp-color: var(--c5-console); }

    .comp-card :is(select, textarea, input, button):focus-visible {
      outline: 2px solid var(--comp-color);
      outline-offset: 1px;
      border-color: var(--comp-color);
    }

    .comp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }

    .comp-title {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--comp-color);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
    }

    .comp-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 21px;
      height: 21px;
      border-radius: 5px;
      background-color: var(--comp-color);
      color: #05080f;
      font-size: 0.76rem;
      font-weight: 800;
    }

    .comp-meta {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Component 1: Voice & Options ───────────────────────────────── */
    .voice-engine-grid {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    @media (max-width: 420px) {
      .voice-engine-grid {
        grid-template-columns: 1fr;
      }
    }

    .options-divider {
      border-top: 1px solid color-mix(in srgb, var(--c1-voice) 18%, transparent);
      padding-top: 0.55rem;
      margin-top: 0.2rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
    }

    @media (max-width: 440px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
      .options-grid .field-compact:first-child {
        grid-column: 1 / -1;
      }
    }

    .field-compact {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .field-micro-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* ── Component 2: Source & Synthesize ───────────────────────────── */
    .source-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
    }

    .toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.22rem 0.55rem;
      min-height: 32px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      background-color: var(--bg-hud);
      border: 1px solid var(--border-base);
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .toggle-chip input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-chip:has(input:checked) {
      border-color: var(--c2-source);
      background-color: color-mix(in srgb, var(--c2-source) 18%, var(--bg-hud));
      color: var(--text-main);
      font-weight: 700;
    }

    textarea#text-input {
      width: 100%;
      min-height: 112px;
      max-height: 280px;
      resize: vertical;
      line-height: 1.5;
      margin-bottom: 0.6rem;
      border-color: color-mix(in srgb, var(--c2-source) 30%, var(--border-base));
    }

    .synthesize-btn {
      width: 100%;
      min-height: 46px;
      background-color: var(--c2-source);
      color: #06080e;
      border: none;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--c2-source) 32%, transparent);
    }

    .synthesize-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .synthesize-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #form-error {
      color: var(--status-err);
      font-size: 0.82rem;
      margin-bottom: 0.45rem;
      display: none;
    }

    /* ── Component 3: Queue (Integrated Player + Track List) ────────── */
    .queue-player-deck {
      background-color: color-mix(in srgb, var(--bg-hud) 88%, transparent);
      border: 1px solid color-mix(in srgb, var(--c3-queue) 34%, transparent);
      border-radius: 8px;
      padding: 0.75rem 0.85rem;
      margin-bottom: 0.8rem;
    }

    .active-track-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
    }

    .active-track-id {
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .caption-viewport {
      background-color: var(--bg-hud);
      border: 1px solid color-mix(in srgb, var(--c3-queue) 24%, transparent);
      border-radius: 7px;
      padding: 0.7rem 0.8rem;
      font-family: var(--font-mono);
      margin-bottom: 0.6rem;
    }

    .caption-viewport.mode-window {
      min-height: 5.1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.35rem;
    }

    .caption-viewport.mode-scroll {
      max-height: 165px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      scroll-behavior: smooth;
    }

    .caption-line {
      min-height: 1.35rem;
      font-size: 0.96rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .word-past {
      color: color-mix(in srgb, var(--c3-queue) 78%, #ffffff);
    }

    .word-active-bold {
      color: var(--c3-queue);
      font-weight: 800;
      text-shadow: 0 0 var(--glow-strength) var(--c3-queue);
    }

    .word-active-underline {
      color: var(--c3-queue);
      text-decoration: underline;
    }

    .word-active-both {
      color: var(--c3-queue);
      font-weight: 800;
      text-decoration: underline;
    }

    .word-active-inverse {
      background-color: var(--c3-queue);
      color: #04080e;
      font-weight: 800;
      padding-inline: 3px;
      border-radius: 3px;
    }

    .word-future {
      color: var(--text-dim);
    }

    .telemetry-strip {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      margin-bottom: 0.55rem;
    }

    .voice-pill {
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .beacon-play {
      color: var(--c3-queue);
      font-weight: 700;
    }

    .beacon-paused {
      color: var(--c2-source);
      font-weight: 700;
    }

    .beacon-idle {
      color: var(--text-dim);
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background-color: var(--bg-elevated);
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--c3-queue);
      transition: width 0.06s linear;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .play-btn {
      min-height: 36px;
      padding: 0.25rem 0.7rem;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      font-weight: 700;
      border-color: var(--c3-queue);
      color: var(--c3-queue);
      background-color: color-mix(in srgb, var(--c3-queue) 14%, var(--bg-hud));
      cursor: pointer;
      white-space: nowrap;
    }

    audio {
      flex: 1;
      height: 34px;
      min-width: 140px;
    }

    /* ── Queue Filter Bar & Queue List ──────────────────────────────── */
    .queue-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.45rem;
      margin-bottom: 0.55rem;
      flex-wrap: wrap;
    }

    .filter-pills {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .filter-pill {
      min-height: 28px;
      padding: 0.15rem 0.55rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      border-radius: 99px;
      background-color: var(--bg-hud);
      border: 1px solid var(--border-base);
      color: var(--text-muted);
      cursor: pointer;
    }

    .filter-pill.active {
      border-color: var(--c3-queue);
      background-color: color-mix(in srgb, var(--c3-queue) 18%, var(--bg-hud));
      color: var(--text-main);
      font-weight: 700;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 390px;
      overflow-y: auto;
      padding-right: 0.15rem;
    }

    .queue-item {
      position: relative;
      background-color: var(--bg-hud);
      border: 1px solid color-mix(in srgb, var(--border-base) 90%, transparent);
      border-left: 3px solid var(--text-dim);
      border-radius: 7px;
      padding: 0.55rem 0.7rem 0.65rem 0.7rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
    }

    .queue-item:hover {
      border-color: color-mix(in srgb, var(--c3-queue) 45%, transparent);
    }

    /* Unplayed item styling */
    .queue-item.is-unplayed {
      border-left-color: var(--c1-voice);
    }

    /* Played item styling */
    .queue-item.is-played {
      border-left-color: var(--text-dim);
      opacity: 0.82;
    }

    /* Highlighted Active / Playing item in the Queue */
    .queue-item.is-active {
      opacity: 1;
      border-color: var(--c3-queue);
      border-left: 4px solid var(--c3-queue);
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--c3-queue) 16%, transparent) 0%, transparent 85%),
        var(--bg-elevated);
      box-shadow: 0 0 16px color-mix(in srgb, var(--c3-queue) 24%, transparent);
    }

    .queue-item-main {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.22rem;
    }

    .queue-item-top {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.76rem;
    }

    .state-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.08rem 0.42rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .state-badge.badge-playing {
      background-color: var(--c3-queue);
      color: #04080e;
    }

    .state-badge.badge-active {
      border: 1px solid var(--c3-queue);
      color: var(--c3-queue);
      background-color: color-mix(in srgb, var(--c3-queue) 14%, transparent);
    }

    .state-badge.badge-resume {
      border: 1px solid var(--c2-source);
      color: var(--c2-source);
      background-color: color-mix(in srgb, var(--c2-source) 14%, transparent);
    }

    .state-badge.badge-unplayed {
      border: 1px solid var(--c1-voice);
      color: var(--c1-voice);
      background-color: color-mix(in srgb, var(--c1-voice) 12%, transparent);
    }

    .state-badge.badge-played {
      border: 1px solid var(--border-base);
      color: var(--text-muted);
      background-color: rgba(255, 255, 255, 0.03);
    }

    .queue-voice-tag {
      font-weight: 800;
      color: var(--text-main);
    }

    .queue-pos-tag {
      color: var(--text-muted);
      margin-left: auto;
    }

    .queue-item-transcript {
      font-size: 0.86rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .queue-item.is-played:not(.is-active) .queue-item-transcript {
      color: var(--text-muted);
    }

    .queue-item-actions {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .queue-mini-btn {
      min-height: 30px;
      padding: 0.15rem 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      border-radius: 5px;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-base);
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .queue-mini-btn:hover {
      color: var(--text-main);
      border-color: var(--c3-queue);
    }

    /* Bottom mini progress bar on each queue item showing remembered position */
    .queue-item-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .queue-item-progress-bar {
      height: 100%;
      width: 0%;
      background-color: var(--c3-queue);
      transition: width 0.12s linear;
    }

    /* ── Collapsible Console Drawer ─────────────────────────────────── */
    details.comp-card {
      padding: 0;
    }

    details.comp-card > summary {
      list-style: none;
      cursor: pointer;
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      user-select: none;
    }

    details.comp-card > summary::-webkit-details-marker {
      display: none;
    }

    .summary-right {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .chevron {
      display: inline-block;
      transition: transform 0.18s ease;
      color: var(--comp-color);
      font-size: 0.8rem;
    }

    details[open] > summary .chevron {
      transform: rotate(180deg);
    }

    .details-body {
      padding: 0 0.9rem 0.8rem 0.9rem;
      border-top: 1px solid color-mix(in srgb, var(--comp-color) 18%, transparent);
      padding-top: 0.65rem;
    }

    .terminal-log {
      background-color: var(--bg-hud);
      border: 1px solid color-mix(in srgb, var(--c4-terminal) 25%, transparent);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      max-height: 170px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line { margin-bottom: 0.2rem; }
    .log-line.cmd { color: var(--c2-source); }
    .log-line.cr { color: var(--c4-terminal); }
    .log-line.done-ok { color: var(--status-ok); font-weight: 700; }
    .log-line.done-err { color: var(--status-err); font-weight: 700; }
  </style>
</head>
<body>
  <!-- Multi-Layer Parallax Background -->
  <div class="parallax-stage" aria-hidden="true">
    <div class="parallax-layer parallax-bg"></div>
    <div class="parallax-layer parallax-mid">
      <div class="geo-shape geo-1"></div>
      <div class="geo-shape geo-2"></div>
      <div class="geo-shape geo-3"></div>
    </div>
  </div>

  <!-- Compact Sticky Header -->
  <header>
    <h1 class="app-brand">
      <span>speak</span>
      <span class="app-version" id="schema-badge">v0.2.0</span>
    </h1>

    <div class="top-bar-controls">
      <select id="cli-runner-select" class="select-mini" aria-label="Run CLI Command">
        <option value="">CLI ▾</option>
        <option value="queue list">speak queue list</option>
        <option value="voices --all">speak voices --all</option>
        <option value="daemon status">speak daemon status</option>
        <option value="set">speak set</option>
        <option value="--help">speak --help</option>
      </select>

      <select id="theme-select" class="select-mini" aria-label="Visual Theme">

      <button type="button" id="parallax-toggle" class="btn-mini" aria-pressed="true" title="Toggle parallax depth">

      </button>

  </header>

  <main>
    <!-- Column 1: Creation Stack (1. Voice & Options, 2. Source) -->
    <div class="col-stack col-form">
      <form id="speak-form" class="col-stack" action="/api/run" method="POST">
        <!-- COMPONENT 1: VOICE & OPTIONS (Cyan) -->
        <section class="comp-card comp-1" aria-label="Voice and Options">
          <div class="comp-header">
            <h2 class="comp-title"><span class="comp-num">1</span> Voice &amp; Options</h2>
            <span class="comp-meta" id="voice-realization-meta">kokoro → river · Scroll · Bold</span>

          <div class="voice-engine-grid">

          <div class="options-divider">
            <div class="options-grid">
              <div class="field-compact">

                </label>
                <select id="target-select" name="playback_target">

                <select id="emphasis-select" name="emphasis">

                  <option value="window">3-Line</option>
                </select>
              </div>
            </div>

        </section>

        <!-- COMPONENT 2: SOURCE (Amber Gold) -->
        <section class="comp-card comp-2" aria-label="Source Input">
          <div class="comp-header">

            <div class="source-toolbar">

            aria-label="Source text to synthesize"
          >All systems nominal, captain. Visual telemetry is online and tracking word by word.</textarea>

          <div id="form-error" role="alert" aria-live="polite"></div>

    <!-- Column 2: Player Stack (3. Player with Play Buttons at Top) -->

        <!-- Player Deck with Controls at the Top! -->

            <span class="beacon-idle" id="hud-beacon">○ IDLE</span>

              <div class="progress-fill" id="hud-progress-fill"></div>

    <!-- Column 3: Queue Stack (4. Queue List & Filters) -->
    <div class="col-stack col-queue">
      <section class="comp-card comp-queue" aria-label="Playback Queue">
        <div class="comp-header">
          <h2 class="comp-title"><span class="comp-num">4</span> Queue</h2>

          <button type="button" id="refresh-queue-btn" class="btn-mini" style="min-height: 28px; padding: 0.1rem 0.5rem;" title="Sync with speak queue CLI">
            ↻ Sync CLI
          </button>

        <!-- Queue Track List -->

      </section>
    </div>

    <!-- Console Drawer (at the end when 1 column, spans across bottom in multi-column) -->
    <div class="col-console">
      <details class="comp-card comp-terminal comp-console" id="terminal-details">
        <summary>
          <span class="comp-title">&gt;_ Console</span>
          <span class="summary-right">
            <span id="terminal-status-badge">idle</span>
            <button type="button" id="clear-log-btn" class="btn-mini" style="min-height: 26px; padding: 0.1rem 0.45rem;">Clear</button>
            <span class="chevron">▾</span>
          </span>
        </summary>
        <div class="details-body">
          <div class="terminal-log" id="terminal-log" role="log" aria-live="polite"></div>
        </div>
      </details>

  </main>

  <script>
    const POS_STORAGE_KEY = "speak-queue-positions-v1";

    const state = {
      schema: null,
      selectedEngine: "kokoro",
      selectedVoice: "river",
      activeTranscript: "",
      words: [],
      lineGroups: [],
      wordTimings: [],
      emphasis: "bold",
      viewMode: "scroll",
      isRunning: false,
      theme: document.documentElement.dataset.theme || "lothal",
      parallax: document.documentElement.dataset.parallax || "on",
      queueItems: [],
      activeId: null,
      queueFilter: "all",
      localPositions: {},
      lastSyncedAt: 0,
    };

    try {
      const savedPos = localStorage.getItem(POS_STORAGE_KEY);
      if (savedPos) {
        state.localPositions = JSON.parse(savedPos) || {};
      }
    } catch (_) {}

    const engineSelectEl = document.getElementById("engine-select");
    const voiceSelectEl = document.getElementById("voice-select");
    const voiceMetaEl = document.getElementById("voice-realization-meta");
    const tagInsertSelectEl = document.getElementById("tag-insert-select");
    const textInputEl = document.getElementById("text-input");
    const speakFormEl = document.getElementById("speak-form");
    const submitBtnEl = document.getElementById("submit-btn");
    const targetSelectEl = document.getElementById("target-select");
    const emphasisSelectEl = document.getElementById("emphasis-select");
    const viewSelectEl = document.getElementById("view-select");
    const captionApertureEl = document.getElementById("caption-aperture");
    const activeTrackLabelEl = document.getElementById("active-track-label");
    const hudVoiceEl = document.getElementById("hud-voice");
    const hudBeaconEl = document.getElementById("hud-beacon");
    const hudProgressFillEl = document.getElementById("hud-progress-fill");
    const hudProgressTrackEl = document.getElementById("hud-progress-track");
    const hudPctEl = document.getElementById("hud-pct");
    const hudTimeEl = document.getElementById("hud-time");
    const audioPlayerEl = document.getElementById("audio-player");
    const playPauseBtnEl = document.getElementById("play-pause-btn");
    const prevTrackBtnEl = document.getElementById("prev-track-btn");
    const nextTrackBtnEl = document.getElementById("next-track-btn");
    const restartTrackBtnEl = document.getElementById("restart-track-btn");
    const terminalLogEl = document.getElementById("terminal-log");
    const terminalStatusBadgeEl = document.getElementById("terminal-status-badge");
    const queueListEl = document.getElementById("queue-list");
    const queueCountsBadgeEl = document.getElementById("queue-counts-badge");
    const themeSelectEl = document.getElementById("theme-select");
    const cliRunnerSelectEl = document.getElementById("cli-runner-select");
    const parallaxToggleEl = document.getElementById("parallax-toggle");

    /* ── Theme & Parallax Depth Controls ────────────────────────────── */
    function applyTheme(themeId, persist = true) {
      const resolved = themeId === "arcade" ? "arcade" : "lothal";
      state.theme = resolved;
      document.documentElement.dataset.theme = resolved;
      themeSelectEl.value = resolved;
      if (persist) {
        try { localStorage.setItem("speak-theme", resolved); } catch (_) {}
      }
    }

    function applyParallax(mode, persist = true) {
      const resolved = mode === "off" ? "off" : "on";
      state.parallax = resolved;
      document.documentElement.dataset.parallax = resolved;
      parallaxToggleEl.setAttribute("aria-pressed", resolved === "on" ? "true" : "false");
      if (persist) {
        try { localStorage.setItem("speak-parallax", resolved); } catch (_) {}
      }
    }

    themeSelectEl.addEventListener("change", () => applyTheme(themeSelectEl.value, true));
    parallaxToggleEl.addEventListener("click", () => {
      applyParallax(state.parallax === "on" ? "off" : "on", true);
    });

    window.addEventListener("scroll", () => {
      if (state.parallax === "on") {
        document.documentElement.style.setProperty("--scroll-y", `${window.scrollY}px`);
      }
    }, { passive: true });

    window.addEventListener("pointermove", (e) => {
      if (state.parallax === "on") {
        const cx = e.clientX - window.innerWidth / 2;
        const cy = e.clientY - window.innerHeight / 2;
        document.documentElement.style.setProperty("--mouse-x", `${cx}px`);
        document.documentElement.style.setProperty("--mouse-y", `${cy}px`);
      }
    }, { passive: true });

    applyTheme(state.theme, false);
    applyParallax(state.parallax, false);

    /* ── Component 1 Meta Summary Updater ───────────────────────────── */
    function updateVoiceAndOptionsMeta() {
      let rVoice = state.selectedEngine;
      if (state.schema) {
        const p = state.schema.personas.find((item) => item.id === voiceSelectEl.value);
        if (p) {
          const rDetail = p.realization_details?.[state.selectedEngine];
          rVoice = rDetail?.voice || (rDetail?.blend ? "blend" : state.selectedEngine);
        }
      }
      const eLabel = emphasisSelectEl.options[emphasisSelectEl.selectedIndex]?.text || "Bold";
      const vLabel = viewSelectEl.options[viewSelectEl.selectedIndex]?.text || "Scroll";
      voiceMetaEl.textContent = `${state.selectedEngine} → ${rVoice} · ${vLabel} · ${eLabel}`;
    }

    targetSelectEl.addEventListener("change", updateVoiceAndOptionsMeta);
    emphasisSelectEl.addEventListener("change", () => {
      state.emphasis = emphasisSelectEl.value;
      updateVoiceAndOptionsMeta();
      renderTeleprompterFrame(audioPlayerEl.currentTime || 0, audioPlayerEl.duration || 1);
    });
    viewSelectEl.addEventListener("change", () => {
      state.viewMode = viewSelectEl.value;
      captionApertureEl.className = `caption-viewport mode-${state.viewMode}`;
      updateVoiceAndOptionsMeta();
      renderTeleprompterFrame(audioPlayerEl.currentTime || 0, audioPlayerEl.duration || 1);
    });

    /* ── Markdown Cleaning & Per-Clause Timing Support ──────────────── */
    function cleanMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/^\s*```[^\n]*\n?/gm, "\n")
        .replace(/^\s*(?:[*_\-]\s*){3,}\s*$/gm, "\n")
        .replace(/(?:^|\s)\*{3,}(?:\s|$)/g, " ")
        .replace(/^\s*#{1,6}\s+(.+?)\s*#*$/gm, "$1:")
        .replace(/!\[([^\]]*)\]\([^)]+\)/g, "$1")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .replace(/\*{1,3}([^*\n]+?)\*{1,3}/g, "$1")
        .replace(/`+([^`\n]+?)`+/g, "$1")
        .replace(/\*+/g, "")
        .trim();
    }

    function estimateSyllables(w) {
      const clean = w.replace(/[^a-zA-Z]/g, "").toLowerCase();
      if (clean.length <= 3) return 1;
      const m = clean.match(/[aeiouy]+/g);
      return m ? Math.max(1, m.length) : 1;
    }

    function wrapWordsIntoLines(words, maxChars = 44) {
      const groups = [];
      let current = [];
      let curLen = 0;

      for (const w of words) {
        const wLen = w.length;
        if (current.length > 0 && curLen + 1 + wLen > maxChars) {
          groups.push(current);
          current = [w];
          curLen = wLen;
        } else {
          current.push(w);
          curLen += (current.length === 1 ? wLen : 1 + wLen);
          if (w.endsWith(".") || w.endsWith("!") || w.endsWith("?") || (curLen >= 18 && (w.endsWith(",") || w.endsWith(":") || w.endsWith(";")))) {
            groups.push(current);
            current = [];
            curLen = 0;
          }
        }
      }
      if (current.length > 0) groups.push(current);
      return groups;
    }

    function setTeleprompterTranscript(text, voiceId = "river", timingMeta = null, initialPos = 0, fallbackDur = 1) {
      const cleaned = cleanMarkdown(text || "");
      state.activeTranscript = cleaned;
      state.words = [];
      state.lineGroups = [];
      state.wordTimings = [];

      if (timingMeta && Array.isArray(timingMeta.clauses) && timingMeta.clauses.length > 0) {
        for (const c of timingMeta.clauses) {
          const cWords = (c.words && c.words.length) ? c.words : (c.text || "").split(/\s+/).filter(Boolean);
          if (!cWords.length) continue;
          const cStart = Number(c.start || 0);
          const cEnd = Number(c.speech_end ?? c.end ?? (cStart + 0.2));
          const cDur = Math.max(0.02, cEnd - cStart);

          const cLines = wrapWordsIntoLines(cWords, 44);
          state.lineGroups.push(...cLines);
          state.words.push(...cWords);

          const weights = cWords.map(estimateSyllables);
          const totW = weights.reduce((a, b) => a + b, 0) || 1;
          let tCursor = cStart;
          for (const wWeight of weights) {
            const wDur = cDur * (wWeight / totW);
            state.wordTimings.push([tCursor, tCursor + wDur]);
            tCursor += wDur;
          }
        }
      } else {
        state.words = cleaned.split(/\s+/).filter(Boolean);
        state.lineGroups = wrapWordsIntoLines(state.words, 44);
      }

      const persona = (state.schema?.personas || []).find(
        (p) => p.id.toLowerCase() === (voiceId || "").toLowerCase()
      );
      hudVoiceEl.textContent = (voiceId || "VOICE").toUpperCase();
      hudVoiceEl.style.color = persona ? persona.hex_color : "var(--c1-voice)";

      const effDur = audioPlayerEl.duration || timingMeta?.total_duration || fallbackDur || 1;
      renderTeleprompterFrame(initialPos || 0, effDur);
    }

    function findActiveWordPosition(elapsed, duration) {
      const totalWords = state.words.length;
      if (!totalWords || !state.lineGroups.length) return [0, 0];

      let currWordIdx = 0;
      if (state.wordTimings.length === totalWords) {
        for (let i = 0; i < totalWords; i++) {
          if (elapsed >= state.wordTimings[i][0]) {
            currWordIdx = i;
          } else {
            break;
          }
        }
      } else {
        const ratio = duration > 0 ? Math.min(1, Math.max(0, elapsed / duration)) : 0;
        currWordIdx = Math.min(totalWords - 1, Math.max(0, Math.floor(ratio * totalWords)));
      }

      let wordCounter = 0;
      for (let lIdx = 0; lIdx < state.lineGroups.length; lIdx++) {
        const lineWords = state.lineGroups[lIdx];
        if (wordCounter + lineWords.length > currWordIdx) {
          return [lIdx, currWordIdx - wordCounter];
        }
        wordCounter += lineWords.length;
      }
      const lastIdx = state.lineGroups.length - 1;
      return [lastIdx, state.lineGroups[lastIdx].length - 1];
    }

    function buildLineElement(lineWords, lineIdx, activeLineIdx, activeWordInLine) {
      const div = document.createElement("div");
      div.className = "caption-line";
      if (lineIdx < activeLineIdx) {
        div.classList.add("word-past");
        div.textContent = lineWords.join(" ");
      } else if (lineIdx > activeLineIdx) {
        div.classList.add("word-future");
        div.textContent = lineWords.join(" ");
      } else {
        lineWords.forEach((w, wIdx) => {
          const span = document.createElement("span");
          if (wIdx < activeWordInLine) span.className = "word-past";
          else if (wIdx === activeWordInLine) span.className = `word-active-${state.emphasis}`;
          else span.className = "word-future";
          span.textContent = w;
          div.appendChild(span);
          if (wIdx < lineWords.length - 1) div.appendChild(document.createTextNode(" "));
        });
      }
      return div;
    }

    function formatMMSS(sec) {
      if (!Number.isFinite(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function renderTeleprompterFrame(elapsed, duration) {
      captionApertureEl.innerHTML = "";

      if (!state.words.length || !state.lineGroups.length) {
        const empty = document.createElement("div");
        empty.className = "caption-line word-future";
        empty.textContent = "Synthesize source text or select a track from the queue.";
        captionApertureEl.appendChild(empty);
        return;
      }

      const [activeLineIdx, activeWordInLine] = findActiveWordPosition(elapsed, duration);

      if (state.viewMode === "scroll") {
        let activeEl = null;
        state.lineGroups.forEach((lineWords, idx) => {
          const el = buildLineElement(lineWords, idx, activeLineIdx, activeWordInLine);
          if (idx === activeLineIdx) activeEl = el;
          captionApertureEl.appendChild(el);
        });
        if (activeEl) {
          const topPos = activeEl.offsetTop - captionApertureEl.offsetTop - (captionApertureEl.clientHeight / 2) + (activeEl.clientHeight / 2);
          captionApertureEl.scrollTop = Math.max(0, topPos);
        }
      } else {
        const startLineIdx = activeLineIdx - 1;
        for (let slot = 0; slot < 3; slot++) {
          const targetIdx = startLineIdx + slot;
          if (targetIdx < 0 || targetIdx >= state.lineGroups.length) {
            const blank = document.createElement("div");
            blank.className = "caption-line";
            captionApertureEl.appendChild(blank);
          } else {
            captionApertureEl.appendChild(
              buildLineElement(state.lineGroups[targetIdx], targetIdx, activeLineIdx, activeWordInLine)
            );
          }
        }
      }

      const ratio = duration > 0 ? Math.min(1, Math.max(0, elapsed / duration)) : 0;
      const pct = Math.round(ratio * 100);
      hudProgressFillEl.style.width = `${pct}%`;
      hudPctEl.textContent = `${pct}%`;
      hudTimeEl.textContent = `${formatMMSS(elapsed)} / ${formatMMSS(duration)}`;

      // Update live progress & position label on the highlighted active row in the queue
      if (state.activeId) {
        const activeRow = queueListEl.querySelector(`[data-item-id="${state.activeId}"]`);
        if (activeRow) {
          const posEl = activeRow.querySelector(".queue-pos-tag");
          if (posEl) posEl.textContent = `${formatMMSS(elapsed)} / ${formatMMSS(duration)}`;
          const barEl = activeRow.querySelector(".queue-item-progress-bar");
          if (barEl) barEl.style.width = `${pct}%`;
        }
      }
    }

    /* ── Queue State & Position Persistence (CLI + localStorage) ────── */
    function saveLocalPosition(itemId, posSec) {
      if (!itemId) return;
      state.localPositions[itemId] = Math.max(0, Number(posSec) || 0);
      try {
        localStorage.setItem(POS_STORAGE_KEY, JSON.stringify(state.localPositions));
      } catch (_) {}
      const item = state.queueItems.find((it) => it.id === itemId);
      if (item) {
        item.position_seconds = state.localPositions[itemId];
      }
    }

    async function syncQueueStateToCli(itemId, updates = {}, refreshDom = true) {
      if (!itemId) return;
      if (updates.position_seconds !== undefined) {
        saveLocalPosition(itemId, updates.position_seconds);
      }
      try {
        const resp = await fetch("/api/queue/state", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: itemId, ...updates }),
        });
        if (resp.ok) {
          const data = await resp.json();
          applyQueuePayload(data, refreshDom);
        }
      } catch (_) {}
    }

    function getRememberedPosition(item) {
      if (!item) return 0;
      const localPos = state.localPositions[item.id];
      const cliPos = Number(item.position_seconds || 0);
      const pos = localPos !== undefined ? Math.max(localPos, cliPos) : cliPos;
      const dur = Number(item.duration_seconds || 0);
      if (dur > 0 && pos >= dur - 0.5) return 0;
      return Math.max(0, pos);
    }

    function selectQueueItem(itemId, autoPlay = false, startFromZero = false) {
      const item = state.queueItems.find((it) => it.id === itemId);
      if (!item) return;

      // Save current track position before switching
      if (state.activeId && state.activeId !== itemId && audioPlayerEl.currentTime > 0) {
        const prevId = state.activeId;
        const prevTime = audioPlayerEl.currentTime;
        syncQueueStateToCli(prevId, { position_seconds: prevTime }, false);
      }

      state.activeId = item.id;
      const resumePos = startFromZero ? 0 : getRememberedPosition(item);
      if (startFromZero) {
        saveLocalPosition(item.id, 0);
        item.position_seconds = 0;
      }

      activeTrackLabelEl.textContent = `${(item.voice || "voice").toUpperCase()} · ${item.id}`;
      setTeleprompterTranscript(
        item.transcript || "",
        item.voice || state.selectedVoice,
        item.timing,
        resumePos,
        item.duration_seconds || 1
      );

      const targetUrl = item.url;
      const applySeekAndPlay = () => {
        if (resumePos > 0 && (!audioPlayerEl.duration || resumePos < audioPlayerEl.duration - 0.25)) {
          try { audioPlayerEl.currentTime = resumePos; } catch (_) {}
        } else if (startFromZero) {
          try { audioPlayerEl.currentTime = 0; } catch (_) {}
        }
        renderTeleprompterFrame(audioPlayerEl.currentTime || resumePos, audioPlayerEl.duration || item.duration_seconds || 1);
        if (autoPlay) {
          audioPlayerEl.play().catch(() => {});
        } else if (resumePos > 0) {
          hudBeaconEl.textContent = `⏸ ${formatMMSS(resumePos)}`;
          hudBeaconEl.className = "beacon-paused";
        } else {
          hudBeaconEl.textContent = item.played ? "✓ PLAYED" : "○ READY";
          hudBeaconEl.className = "beacon-idle";
        }
      };

      if (audioPlayerEl.getAttribute("data-loaded-id") !== item.id) {
        audioPlayerEl.setAttribute("data-loaded-id", item.id);
        audioPlayerEl.src = targetUrl;
        audioPlayerEl.addEventListener("loadedmetadata", applySeekAndPlay, { once: true });
      } else {
        applySeekAndPlay();
      }

      renderQueueList();
      syncQueueStateToCli(item.id, {
        active: true,
        position_seconds: resumePos,
        status: autoPlay ? "playing" : (item.played ? "played" : "unplayed"),
      }, false);
    }

    /* ── Audio Player Events (Live Teleprompter + Position Memory) ──── */
    audioPlayerEl.addEventListener("play", () => {
      hudBeaconEl.textContent = "● PLAYING";
      hudBeaconEl.className = "beacon-play";
      playPauseBtnEl.textContent = "⏸ Pause";
      renderQueueList();
      requestAnimationFrame(stepTeleprompter);
    });

    audioPlayerEl.addEventListener("pause", () => {
      if (audioPlayerEl.ended) return;
      const pos = audioPlayerEl.currentTime || 0;
      hudBeaconEl.textContent = pos > 0 ? `⏸ ${formatMMSS(pos)}` : "○ PAUSED";
      hudBeaconEl.className = "beacon-paused";
      playPauseBtnEl.textContent = "▶ Resume";
      if (state.activeId) {
        syncQueueStateToCli(state.activeId, { position_seconds: pos });
      }
    });

    audioPlayerEl.addEventListener("ended", async () => {
      hudBeaconEl.textContent = "✓ PLAYED";
      hudBeaconEl.className = "beacon-play";
      playPauseBtnEl.textContent = "▶ Replay";
      const dur = audioPlayerEl.duration || 1;
      renderTeleprompterFrame(dur, dur);

      if (state.activeId) {
        const finishedId = state.activeId;
        saveLocalPosition(finishedId, 0);
        await syncQueueStateToCli(finishedId, {
          played: true,
          status: "played",
          position_seconds: 0,
        });

        // Auto-advance to the next unplayed item in queue if one exists
        const currentIdx = state.queueItems.findIndex((it) => it.id === finishedId);
        const nextUnplayed = state.queueItems.find((it, idx) => idx > currentIdx && !it.played)
          || state.queueItems.find((it) => !it.played && it.id !== finishedId);
        if (nextUnplayed) {
          selectQueueItem(nextUnplayed.id, true, false);
        }
      }
    });

    audioPlayerEl.addEventListener("timeupdate", () => {
      const cur = audioPlayerEl.currentTime || 0;
      const dur = audioPlayerEl.duration || 1;
      renderTeleprompterFrame(cur, dur);

      if (state.activeId && !audioPlayerEl.paused) {
        saveLocalPosition(state.activeId, cur);
        const now = Date.now();
        if (now - state.lastSyncedAt > 3000) {
          state.lastSyncedAt = now;
          syncQueueStateToCli(state.activeId, { position_seconds: cur, status: "playing" }, false);
        }
      }
    });

    window.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && state.activeId && audioPlayerEl.currentTime > 0) {
        const payload = JSON.stringify({
          id: state.activeId,
          position_seconds: audioPlayerEl.currentTime,
        });
        if (navigator.sendBeacon) {
          navigator.sendBeacon("/api/queue/state", new Blob([payload], { type: "application/json" }));
        }
      }
    });

    function stepTeleprompter() {
      if (!audioPlayerEl.paused) {
        renderTeleprompterFrame(audioPlayerEl.currentTime, audioPlayerEl.duration || 1);
        requestAnimationFrame(stepTeleprompter);
      }
    }

    hudProgressTrackEl.addEventListener("click", (e) => {
      if (!audioPlayerEl.duration) return;
      const rect = hudProgressTrackEl.getBoundingClientRect();
      const clickRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const newTime = clickRatio * audioPlayerEl.duration;
      audioPlayerEl.currentTime = newTime;
      renderTeleprompterFrame(newTime, audioPlayerEl.duration);
      if (state.activeId) {
        syncQueueStateToCli(state.activeId, { position_seconds: newTime }, false);
      }
    });

    playPauseBtnEl.addEventListener("click", () => {
      if (!audioPlayerEl.src && state.queueItems.length > 0) {
        selectQueueItem(state.activeId || state.queueItems[0].id, true, false);
        return;
      }
      if (!audioPlayerEl.src) return;
      if (audioPlayerEl.paused) audioPlayerEl.play();
      else audioPlayerEl.pause();
    });

    restartTrackBtnEl.addEventListener("click", () => {
      if (!state.activeId) return;
      selectQueueItem(state.activeId, true, true);
    });

    prevTrackBtnEl.addEventListener("click", () => {
      if (!state.queueItems.length) return;
      const idx = state.queueItems.findIndex((it) => it.id === state.activeId);
      const prevIdx = idx > 0 ? idx - 1 : state.queueItems.length - 1;
      selectQueueItem(state.queueItems[prevIdx].id, !audioPlayerEl.paused, false);
    });

    nextTrackBtnEl.addEventListener("click", () => {
      if (!state.queueItems.length) return;
      const idx = state.queueItems.findIndex((it) => it.id === state.activeId);
      const nextIdx = idx >= 0 && idx < state.queueItems.length - 1 ? idx + 1 : 0;
      selectQueueItem(state.queueItems[nextIdx].id, !audioPlayerEl.paused, false);
    });

    /* ── Queue Rendering (Played vs Unplayed + Highlighted Active) ──── */
    function applyQueuePayload(data, refreshDom = true) {
      state.queueItems = data.items || [];
      if (data.active_id) {
        state.activeId = data.active_id;
      } else if (!state.activeId && state.queueItems.length > 0) {
        state.activeId = state.queueItems[0].id;
      }

      const counts = data.counts || {
        total: state.queueItems.length,
        unplayed: state.queueItems.filter((i) => !i.played).length,
        played: state.queueItems.filter((i) => i.played).length,
      };
      queueCountsBadgeEl.textContent = `${counts.unplayed} unplayed · ${counts.played} played`;

      if (refreshDom) {
        renderQueueList();
      }
    }

    function renderQueueList() {
      queueListEl.innerHTML = "";

      const filtered = state.queueItems.filter((item) => {
        if (state.queueFilter === "unplayed") return !item.played;
        if (state.queueFilter === "played") return Boolean(item.played);
        return true;
      });

      if (filtered.length === 0) {
        const empty = document.createElement("div");
        empty.className = "comp-meta";
        empty.style.padding = "0.6rem 0.2rem";
        empty.textContent = state.queueFilter === "all"
          ? "Queue is empty. Use 2 Source → Synthesize to add audio."
          : `No ${state.queueFilter} items in queue.`;
        queueListEl.appendChild(empty);
        return;
      }

      for (const item of filtered) {
        const isActive = item.id === state.activeId;
        const isPlayingNow = isActive && !audioPlayerEl.paused && audioPlayerEl.src;
        const pos = isActive && audioPlayerEl.currentTime > 0
          ? audioPlayerEl.currentTime
          : getRememberedPosition(item);
        const dur = Number(item.duration_seconds || 0);
        const pct = dur > 0 ? Math.min(100, Math.round((pos / dur) * 100)) : (item.played ? 100 : 0);

        const row = document.createElement("div");
        row.className = `queue-item ${item.played ? "is-played" : "is-unplayed"} ${isActive ? "is-active" : ""}`.trim();
        row.setAttribute("role", "listitem");
        row.setAttribute("data-item-id", item.id);

        const main = document.createElement("div");
        main.className = "queue-item-main";

        const top = document.createElement("div");
        top.className = "queue-item-top";

        const badge = document.createElement("span");
        if (isPlayingNow) {
          badge.className = "state-badge badge-playing";
          badge.textContent = "▶ PLAYING";
        } else if (isActive) {
          badge.className = "state-badge badge-active";
          badge.textContent = pos > 0 ? "⏸ ACTIVE" : "◈ SELECTED";
        } else if (item.played) {
          badge.className = "state-badge badge-played";
          badge.textContent = "✓ PLAYED";
        } else if (pos > 0) {
          badge.className = "state-badge badge-resume";
          badge.textContent = "◐ RESUME";
        } else {
          badge.className = "state-badge badge-unplayed";
          badge.textContent = "○ UNPLAYED";
        }

        const voiceTag = document.createElement("span");
        voiceTag.className = "queue-voice-tag";
        voiceTag.textContent = `${(item.voice || "voice").toUpperCase()} · ${item.engine || "kokoro"}`;

        const posTag = document.createElement("span");
        posTag.className = "queue-pos-tag";
        posTag.textContent = `${formatMMSS(pos)} / ${formatMMSS(dur)}`;

        top.appendChild(badge);
        top.appendChild(voiceTag);
        top.appendChild(posTag);

        const transcriptDiv = document.createElement("div");
        transcriptDiv.className = "queue-item-transcript";
        transcriptDiv.textContent = item.transcript || item.filename;

        main.appendChild(top);
        main.appendChild(transcriptDiv);

        const actions = document.createElement("div");
        actions.className = "queue-item-actions";

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "queue-mini-btn";
        playBtn.textContent = isPlayingNow ? "⏸" : "▶";
        playBtn.title = isPlayingNow ? "Pause" : (pos > 0 ? `Resume from ${formatMMSS(pos)}` : "Play");
        playBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (isActive && audioPlayerEl.src) {
            if (audioPlayerEl.paused) audioPlayerEl.play();
            else audioPlayerEl.pause();
          } else {
            selectQueueItem(item.id, true, false);
          }
        });

        const togglePlayedBtn = document.createElement("button");
        togglePlayedBtn.type = "button";
        togglePlayedBtn.className = "queue-mini-btn";
        togglePlayedBtn.textContent = item.played ? "↺" : "✓";
        togglePlayedBtn.title = item.played ? "Mark as unplayed" : "Mark as played";
        togglePlayedBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          const nextPlayed = !item.played;
          if (!nextPlayed) saveLocalPosition(item.id, 0);
          syncQueueStateToCli(item.id, {
            played: nextPlayed,
            status: nextPlayed ? "played" : "unplayed",
            position_seconds: nextPlayed ? 0 : getRememberedPosition(item),
          });
        });

        const dlLink = document.createElement("a");
        dlLink.href = item.url;
        dlLink.download = item.filename;
        dlLink.className = "queue-mini-btn";
        dlLink.textContent = "⬇";
        dlLink.title = "Download WAV";
        dlLink.addEventListener("click", (e) => e.stopPropagation());

        actions.appendChild(playBtn);
        actions.appendChild(togglePlayedBtn);
        actions.appendChild(dlLink);

        const progressWrap = document.createElement("div");
        progressWrap.className = "queue-item-progress";
        const progressBar = document.createElement("div");
        progressBar.className = "queue-item-progress-bar";
        progressBar.style.width = `${pct}%`;
        progressWrap.appendChild(progressBar);

        row.appendChild(main);
        row.appendChild(actions);
        row.appendChild(progressWrap);

        row.addEventListener("click", () => {
          selectQueueItem(item.id, true, false);
        });

        queueListEl.appendChild(row);
      }
    }

    document.querySelectorAll(".filter-pill").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-pill").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        state.queueFilter = btn.getAttribute("data-filter") || "all";
        renderQueueList();
      });
    });

    async function loadQueue(autoCueActive = false) {
      const resp = await fetch("/api/queue");
      if (!resp.ok) return;
      const data = await resp.json();
      applyQueuePayload(data, true);

      if (autoCueActive && state.activeId) {
        selectQueueItem(state.activeId, false, false);
      }
    }

    document.getElementById("refresh-queue-btn").addEventListener("click", () => {
      loadQueue(false);
    });

    textInputEl.addEventListener("keydown", (e) => {
      if (e.isComposing) return;
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        speakFormEl.requestSubmit();
      }
    });

    /* ── SSE Execution & Console Output Stream ─────────────────────── */
    function appendLogLine(text, cls = "") {
      const div = document.createElement("div");
      div.className = `log-line ${cls}`.trim();
      div.textContent = text;
      terminalLogEl.appendChild(div);
      terminalLogEl.scrollTop = terminalLogEl.scrollHeight;
      return div;
    }

    let activeCrLineEl = null;

    async function executeAndStream(payload) {
      if (state.isRunning) return;
      state.isRunning = true;
      submitBtnEl.disabled = true;
      submitBtnEl.innerHTML = "<span>⚙ Synthesizing...</span>";
      terminalStatusBadgeEl.textContent = "synthesizing...";
      activeCrLineEl = null;

      try {
        const resp = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!resp.ok || !resp.body) {
          appendLogLine(`HTTP Error: ${resp.status}`, "done-err");
          terminalStatusBadgeEl.textContent = "error";
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split("\n\n");
          buffer = events.pop() || "";

          for (const rawEv of events) {
            const lines = rawEv.split("\n");
            let evType = "message";
            let dataStr = "";
            for (const l of lines) {
              if (l.startsWith("event:")) evType = l.slice(6).trim();
              else if (l.startsWith("data:")) dataStr += l.slice(5).trim();
            }
            if (!dataStr) continue;
            const data = JSON.parse(dataStr);

            if (evType === "start") {
              appendLogLine(`$ ${data.command}`, "cmd");
            } else if (evType === "output") {
              if (data.is_cr) {
                if (!activeCrLineEl) activeCrLineEl = appendLogLine(data.line, "cr");
                else activeCrLineEl.textContent = data.line;
              } else {
                activeCrLineEl = null;
                appendLogLine(data.line);
              }
            } else if (evType === "done") {
              activeCrLineEl = null;
              if (data.exit_code === 0) {
                terminalStatusBadgeEl.textContent = "exit 0";
                appendLogLine("✓ exit 0", "done-ok");
                await loadQueue(false);
                if (data.output && data.output.id) {
                  // Highlight and play the newly synthesized queue item
                  selectQueueItem(data.output.id, true, true);
                }
              } else {
                terminalStatusBadgeEl.textContent = `exit ${data.exit_code}`;
                appendLogLine(`✗ exit ${data.exit_code}`, "done-err");
              }
            }
          }
        }
      } catch (err) {
        terminalStatusBadgeEl.textContent = "error";
        appendLogLine(`Error: ${err.message}`, "done-err");
      } finally {
        state.isRunning = false;
        submitBtnEl.disabled = false;
        submitBtnEl.innerHTML = "<span>⚙ Synthesize</span>";
      }
    }

    /* ── Schema Introspection & Pulldown Population ─────────────────── */
    function populateVoicesForEngine(engineId) {
      if (!state.schema) return;
      voiceSelectEl.innerHTML = "";
      const available = state.schema.personas.filter((p) =>
        p.realizations.includes(engineId)
      );

      for (const p of available) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = `${p.glyph} ${p.name} — ${p.style}`;
        if (p.id === state.selectedVoice) opt.selected = true;
        voiceSelectEl.appendChild(opt);
      }

      if (voiceSelectEl.selectedIndex === -1 && available.length > 0) {
        const riverOpt = available.find((p) => p.id === "river");
        voiceSelectEl.value = riverOpt ? "river" : available[0].id;
      }
      updateVoiceMeta();
    }

    function updateVoiceMeta() {
      if (!state.schema) return;
      const vId = voiceSelectEl.value;
      state.selectedVoice = vId;
      updateVoiceAndOptionsMeta();
    }

    async function loadSchema() {
      const resp = await fetch("/api/schema");
      const schema = await resp.json();
      state.schema = schema;

      document.getElementById("schema-badge").textContent =
        `${schema.engines.length}e · ${schema.personas.length}v`;

      state.selectedEngine = schema.user_config?.engine || "kokoro";
      state.selectedVoice = schema.user_config?.persona || "river";
      if (schema.user_config?.emphasis) {
        state.emphasis = schema.user_config.emphasis;
        emphasisSelectEl.value = state.emphasis;
      }
      if (schema.user_config?.view) {
        state.viewMode = schema.user_config.view;
        viewSelectEl.value = state.viewMode;
        captionApertureEl.className = `caption-viewport mode-${state.viewMode}`;
      }

      engineSelectEl.innerHTML = "";
      for (const eng of schema.engines) {
        const opt = document.createElement("option");
        opt.value = eng.id;
        opt.textContent = `${eng.id} (${eng.label})`;
        if (eng.id === state.selectedEngine) opt.selected = true;
        engineSelectEl.appendChild(opt);
      }

      populateVoicesForEngine(state.selectedEngine);

      tagInsertSelectEl.innerHTML = '<option value="">+ [tag] ▾</option>';
      for (const tag of schema.help.audio_tags || []) {
        const opt = document.createElement("option");
        opt.value = tag;
        opt.textContent = tag;
        tagInsertSelectEl.appendChild(opt);
      }
    }

    engineSelectEl.addEventListener("change", () => {
      state.selectedEngine = engineSelectEl.value;
      populateVoicesForEngine(state.selectedEngine);
    });

    voiceSelectEl.addEventListener("change", updateVoiceMeta);

    tagInsertSelectEl.addEventListener("change", () => {
      const tag = tagInsertSelectEl.value;
      if (!tag) return;
      const start = textInputEl.selectionStart || 0;
      const end = textInputEl.selectionEnd || 0;
      const val = textInputEl.value;
      textInputEl.value = `${val.slice(0, start)}${tag} ${val.slice(end)}`;
      tagInsertSelectEl.value = "";
      textInputEl.focus();
    });

    cliRunnerSelectEl.addEventListener("change", () => {
      const cmd = cliRunnerSelectEl.value;
      if (!cmd) return;
      cliRunnerSelectEl.value = "";
      document.getElementById("terminal-details").open = true;
      executeAndStream({
        mode: "subcommand",
        subcommand_args: cmd.split(/\s+/),
      });
    });

    speakFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const formErr = document.getElementById("form-error");
      formErr.style.display = "none";
      formErr.textContent = "";

      const useClipboard = document.getElementById("flag-clipboard").checked;
      const textVal = textInputEl.value.trim();
      if (!useClipboard && !textVal) {
        formErr.textContent = "Enter source text or enable -c Clip.";
        formErr.style.display = "block";
        textInputEl.focus();
        return;
      }

      executeAndStream({
        mode: "narrate",
        engine: state.selectedEngine,
        voice: voiceSelectEl.value,
        text: textVal,
        clipboard: useClipboard,
        raw: document.getElementById("flag-raw").checked,
        playback_target: targetSelectEl.value,
      });
    });

    document.getElementById("clear-log-btn").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      terminalLogEl.innerHTML = "";
      terminalStatusBadgeEl.textContent = "cleared";
    });

    (async () => {
      await loadSchema();
      await loadQueue(true);
    })();
  </script>
</body>
</html>
