<!DOCTYPE html>
<html lang="en" data-theme="lothal" data-parallax="on">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <script>
    try {
      const savedTheme = localStorage.getItem("speak-theme");
      if (savedTheme === "arcade" || savedTheme === "lothal") {
        document.documentElement.dataset.theme = savedTheme;
      }
      const savedParallax = localStorage.getItem("speak-parallax");
      if (savedParallax === "off" || savedParallax === "on") {
        document.documentElement.dataset.parallax = savedParallax;
      }
    } catch (_) {}
  </script>
  <title>speak</title>
  <style>
    :root {
      color-scheme: dark;
      --scroll-y: 0px;
      --mouse-x: 0px;
      --mouse-y: 0px;

      /* Theme 1: Lothal — Deep Slate & Distinct Component Palette */
      --bg-base: #080b12;
      --bg-panel: rgba(15, 21, 35, 0.86);
      --bg-elevated: #162035;
      --bg-hud: #05080f;
      --text-main: #ecf3f8;
      --text-muted: #8aa0b8;
      --text-dim: #49657a;
      --border-base: rgba(255, 255, 255, 0.1);

      /* 6 Distinct Component Colors (Lothal) */
      --c1-voice: #00f5d4;     /* 1. Voice & Engine: Cyan */
      --c2-text: #ffbe0b;      /* 2. Text & Speak: Amber Gold */
      --c3-options: #b197fc;   /* 3. Options: Violet */
      --c4-player: #38d9a9;    /* 4. Player & Captions: Emerald */
      --c5-terminal: #4dabf7;  /* 5. Terminal Output: Sky Blue */
      --c6-files: #ff6b6b;     /* 6. Saved Files: Coral */

      --status-ok: #51cf66;
      --status-err: #ff6b6b;
      --status-warn: #fcc419;

      --card-radius: 10px;
      --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      --glow-strength: 0px;

      --font-prose: "Atkinson Hyperlegible", "Lexend", "OpenDyslexic Nerd Font", system-ui, -apple-system, sans-serif;
      --font-mono: "OpenDyslexicMono Nerd Font", "OpenDyslexic Nerd Font", ui-monospace, "SF Mono", Menlo, monospace;
    }

    /* Theme 2: 1984 Arcade — High-Contrast CRT Vector Cabinet (Visual Only) */
    :root[data-theme="arcade"] {
      --bg-base: #06010d;
      --bg-panel: rgba(18, 5, 36, 0.88);
      --bg-elevated: #220a45;
      --bg-hud: #04000a;
      --text-main: #fff5fc;
      --text-muted: #c896ff;
      --text-dim: #6f3b9e;
      --border-base: rgba(255, 42, 133, 0.28);

      /* 6 Distinct Component Colors (1984 Arcade) */
      --c1-voice: #00f0ff;     /* 1. Voice & Engine: Vector Cyan */
      --c2-text: #ffe600;      /* 2. Text & Speak: Laser Yellow */
      --c3-options: #d946ef;   /* 3. Options: Neon Purple */
      --c4-player: #00ff66;    /* 4. Player & Captions: Phosphor Green */
      --c5-terminal: #3a86ff;  /* 5. Terminal Output: Arcade Blue */
      --c6-files: #ff2a85;     /* 6. Saved Files: Neon Magenta */

      --status-ok: #00ff66;
      --status-err: #ff0055;
      --status-warn: #ffe600;

      --card-radius: 6px;
      --card-shadow: 0 0 18px rgba(0, 0, 0, 0.7);
      --glow-strength: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-prose);
      font-size: 1rem;
      line-height: 1.4;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }

    /* Subtle CRT scanline overlay in Arcade theme */
    :root[data-theme="arcade"] body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.2) 0px,
        rgba(0, 0, 0, 0.2) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    /* ── Layered Parallax Backdrop (Background + Midground) ─────────── */
    .parallax-stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    :root[data-parallax="off"] .parallax-stage {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .parallax-layer {
        transform: none !important;
      }
    }

    .parallax-layer {
      position: absolute;
      inset: -15%;
      will-change: transform;
      transition: transform 0.08s linear;
    }

    /* Layer 1: Slow Background Grid (0.14x scroll speed) */
    .parallax-bg {
      transform: translate3d(
        calc(var(--mouse-x) * -0.015),
        calc(var(--scroll-y) * -0.14 + var(--mouse-y) * -0.015),
        0
      );
      background-image:
        radial-gradient(circle at 18% 20%, color-mix(in srgb, var(--c1-voice) 12%, transparent) 0%, transparent 40%),
        radial-gradient(circle at 82% 35%, color-mix(in srgb, var(--c2-text) 10%, transparent) 0%, transparent 38%),
        radial-gradient(circle at 25% 78%, color-mix(in srgb, var(--c4-player) 11%, transparent) 0%, transparent 42%),
        radial-gradient(circle at 80% 82%, color-mix(in srgb, var(--c6-files) 10%, transparent) 0%, transparent 40%),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
    }

    /* Layer 2: Midground Geometric Shapes (Okalpha / Bake 003 style, 0.32x scroll speed) */
    .parallax-mid {
      transform: translate3d(
        calc(var(--mouse-x) * 0.03),
        calc(var(--scroll-y) * -0.32 + var(--mouse-y) * 0.03),
        0
      );
    }

    .geo-shape {
      position: absolute;
      opacity: 0.14;
      border: 2px solid currentColor;
    }

    .geo-1 {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      color: var(--c1-voice);
      top: 14%;
      left: 6%;
    }

    .geo-2 {
      width: 140px;
      height: 140px;
      transform: rotate(22deg);
      border-radius: 12px;
      color: var(--c2-text);
      top: 42%;
      right: 7%;
    }

    .geo-3 {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      color: var(--c4-player);
      bottom: 12%;
      left: 48%;
    }

    /* ── Compact Sticky Header Bar ──────────────────────────────────── */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background-color: color-mix(in srgb, var(--bg-base) 82%, transparent);
      border-bottom: 1px solid var(--border-base);
      padding: 0.55rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .app-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--c1-voice);
      margin: 0;
      letter-spacing: 0.02em;
    }

    .app-version {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      border: 1px solid var(--border-base);
      padding: 0.1rem 0.4rem;
      border-radius: 99px;
    }

    .top-bar-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Compact Select & Button Primitives (16px font prevents iOS zoom) */
    select,
    input[type="text"],
    textarea,
    button {
      font-family: var(--font-prose);
      font-size: 1rem;
      color: var(--text-main);
      background-color: var(--bg-hud);
      border: 1px solid var(--border-base);
      border-radius: 7px;
      min-height: 42px;
      padding: 0.4rem 0.65rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.12s ease;
    }

    select {
      cursor: pointer;
      padding-right: 1.6rem;
    }

    .select-mini {
      min-height: 36px;
      font-size: 0.85rem;
      font-family: var(--font-mono);
      padding: 0.25rem 0.5rem;
      background-color: var(--bg-elevated);
    }

    .btn-mini {
      min-height: 36px;
      padding: 0.25rem 0.55rem;
      font-size: 0.82rem;
      font-family: var(--font-mono);
      background-color: var(--bg-elevated);
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-mini[aria-pressed="true"] {
      border-color: var(--c1-voice);
      color: var(--c1-voice);
    }

    /* ── Main Layout Grid (Desktop 2-col, iPhone 1-col Tight Stack) ─── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0.85rem;
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: 0.85rem;
      align-items: start;
    }

    .col-stack {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-width: 0;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        padding: 0.65rem;
        gap: 0.65rem;
      }
      .col-stack {
        gap: 0.65rem;
      }
      header {
        padding: 0.45rem 0.65rem;
      }
      .app-version {
        display: none;
      }
    }

    /* ── Color-Coded Component Cards ────────────────────────────────── */
    .comp-card {
      --comp-color: var(--c1-voice);
      background:
        linear-gradient(135deg, color-mix(in srgb, var(--comp-color) 7%, transparent) 0%, transparent 60%),
        var(--bg-panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid color-mix(in srgb, var(--comp-color) 38%, transparent);
      border-left: 4px solid var(--comp-color);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      padding: 0.8rem 0.9rem;
    }

    .comp-1 { --comp-color: var(--c1-voice); }
    .comp-2 { --comp-color: var(--c2-text); }
    .comp-3 { --comp-color: var(--c3-options); }
    .comp-4 { --comp-color: var(--c4-player); }
    .comp-5 { --comp-color: var(--c5-terminal); }
    .comp-6 { --comp-color: var(--c6-files); }

    .comp-card :is(select, textarea, input, button):focus-visible {
      outline: 2px solid var(--comp-color);
      outline-offset: 1px;
      border-color: var(--comp-color);
    }

    .comp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .comp-title {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--comp-color);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0;
    }

    .comp-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background-color: var(--comp-color);
      color: #05080f;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .comp-meta {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Component 1: Voice & Engine (Single-Row Dual Pulldown) ─────── */
    .voice-engine-grid {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 0.5rem;
    }

    @media (max-width: 400px) {
      .voice-engine-grid {
        grid-template-columns: 1fr;
      }
    }

    .field-compact {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      min-width: 0;
    }

    .field-micro-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* ── Component 2: Text & Speak ──────────────────────────────────── */
    .text-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
    }

    .toggle-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.22rem 0.55rem;
      min-height: 32px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      background-color: var(--bg-hud);
      border: 1px solid var(--border-base);
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .toggle-chip input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-chip:has(input:checked) {
      border-color: var(--c2-text);
      background-color: color-mix(in srgb, var(--c2-text) 18%, var(--bg-hud));
      color: var(--text-main);
      font-weight: 700;
    }

    textarea#text-input {
      width: 100%;
      min-height: 104px;
      max-height: 280px;
      resize: vertical;
      line-height: 1.5;
      margin-bottom: 0.55rem;
      border-color: color-mix(in srgb, var(--c2-text) 30%, var(--border-base));
    }

    .speak-btn {
      width: 100%;
      min-height: 46px;
      background-color: var(--c2-text);
      color: #06080e;
      border: none;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.98rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--c2-text) 32%, transparent);
    }

    .speak-btn:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .speak-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── Collapsible <details> Cards (Options, Terminal, Files) ─────── */
    details.comp-card {
      padding: 0;
    }

    details.comp-card > summary {
      list-style: none;
      cursor: pointer;
      padding: 0.7rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      user-select: none;
    }

    details.comp-card > summary::-webkit-details-marker {
      display: none;
    }

    .summary-right {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .chevron {
      display: inline-block;
      transition: transform 0.18s ease;
      color: var(--comp-color);
      font-size: 0.8rem;
    }

    details[open] > summary .chevron {
      transform: rotate(180deg);
    }

    .details-body {
      padding: 0 0.9rem 0.8rem 0.9rem;
      border-top: 1px solid color-mix(in srgb, var(--comp-color) 18%, transparent);
      padding-top: 0.65rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
    }

    @media (max-width: 440px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
      .options-grid .field-compact:first-child {
        grid-column: 1 / -1;
      }
    }

    /* ── Component 4: Player & Captions ─────────────────────────────── */
    .caption-viewport {
      background-color: var(--bg-hud);
      border: 1px solid color-mix(in srgb, var(--c4-player) 28%, transparent);
      border-radius: 7px;
      padding: 0.75rem 0.85rem;
      font-family: var(--font-mono);
      margin-bottom: 0.65rem;
    }

    .caption-viewport.mode-window {
      min-height: 5.1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.35rem;
    }

    .caption-viewport.mode-scroll {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      scroll-behavior: smooth;
    }

    .caption-line {
      min-height: 1.35rem;
      font-size: 0.98rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .word-past {
      color: color-mix(in srgb, var(--c4-player) 78%, #ffffff);
    }

    .word-active-bold {
      color: var(--c4-player);
      font-weight: 800;
      text-shadow: 0 0 var(--glow-strength) var(--c4-player);
    }

    .word-active-underline {
      color: var(--c4-player);
      text-decoration: underline;
    }

    .word-active-both {
      color: var(--c4-player);
      font-weight: 800;
      text-decoration: underline;
    }

    .word-active-inverse {
      background-color: var(--c4-player);
      color: #04080e;
      font-weight: 800;
      padding-inline: 3px;
      border-radius: 3px;
    }

    .word-future {
      color: var(--text-dim);
    }

    .telemetry-strip {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      margin-bottom: 0.55rem;
    }

    .voice-pill {
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .beacon-play {
      color: var(--c4-player);
      font-weight: 700;
    }

    .beacon-idle {
      color: var(--text-dim);
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background-color: var(--bg-elevated);
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--c4-player);
      transition: width 0.06s linear;
    }

    .player-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .play-btn {
      min-height: 38px;
      padding: 0.3rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      border-color: var(--c4-player);
      color: var(--c4-player);
      background-color: color-mix(in srgb, var(--c4-player) 12%, var(--bg-hud));
      cursor: pointer;
      white-space: nowrap;
    }

    audio {
      flex: 1;
      height: 36px;
      min-width: 0;
    }

    /* ── Component 5: Terminal Output ───────────────────────────────── */
    .terminal-log {
      background-color: var(--bg-hud);
      border: 1px solid color-mix(in srgb, var(--c5-terminal) 25%, transparent);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      max-height: 190px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-line { margin-bottom: 0.2rem; }
    .log-line.cmd { color: var(--c2-text); }
    .log-line.cr { color: var(--c5-terminal); }
    .log-line.done-ok { color: var(--status-ok); font-weight: 700; }
    .log-line.done-err { color: var(--status-err); font-weight: 700; }

    /* ── Component 6: Saved WAV Files ───────────────────────────────── */
    .files-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      max-height: 260px;
      overflow-y: auto;
    }

    .file-row {
      background-color: var(--bg-hud);
      border: 1px solid color-mix(in srgb, var(--c6-files) 22%, transparent);
      border-radius: 6px;
      padding: 0.5rem 0.65rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .file-info {
      min-width: 0;
      flex: 1;
    }

    .file-title {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .link-dl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 0.2rem 0.5rem;
      border-radius: 5px;
      border: 1px solid var(--border-base);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--c6-files);
      text-decoration: none;
    }

    #form-error {
      color: var(--status-err);
      font-size: 0.82rem;
      margin-bottom: 0.4rem;
      display: none;
    }
  </style>
</head>
<body>
  <!-- Multi-Layer Parallax Background (Guided by Parallax-scrolling-examples.md) -->
  <div class="parallax-stage" aria-hidden="true">
    <div class="parallax-layer parallax-bg"></div>
    <div class="parallax-layer parallax-mid">
      <div class="geo-shape geo-1"></div>
      <div class="geo-shape geo-2"></div>
      <div class="geo-shape geo-3"></div>
    </div>
  </div>

  <!-- Compact Sticky Header -->
  <header>
    <h1 class="app-brand">
      <span>speak</span>
      <span class="app-version" id="schema-badge">v0.2.0</span>
    </h1>

    <div class="top-bar-controls">
      <select id="cli-runner-select" class="select-mini" aria-label="Run CLI Command">
        <option value="">CLI ▾</option>
        <option value="voices --all">speak voices --all</option>
        <option value="daemon status">speak daemon status</option>
        <option value="set">speak set</option>

  <main>
    <!-- Left / Primary Column: 1. Voice, 2. Text, 3. Options -->
    <form id="speak-form" class="col-stack" action="/api/run" method="POST">

            <button type="button" id="refresh-outputs-btn" class="btn-mini" style="min-height: 26px; padding: 0.1rem 0.45rem;">↻</button>
            <span class="chevron">▾</span>

  <script>
    const state = {
      schema: null,
      selectedEngine: "kokoro",
      selectedVoice: "river",
      activeTranscript: "All systems nominal, captain. Visual telemetry is online and tracking word by word.",
      words: [],
      lineGroups: [],
      wordTimings: [],
      emphasis: "bold",
      viewMode: "scroll",
      isRunning: false,
      theme: document.documentElement.dataset.theme || "lothal",
      parallax: document.documentElement.dataset.parallax || "on",
    };

    const engineSelectEl = document.getElementById("engine-select");
    const voiceSelectEl = document.getElementById("voice-select");
    const voiceMetaEl = document.getElementById("voice-realization-meta");
    const tagInsertSelectEl = document.getElementById("tag-insert-select");
    const textInputEl = document.getElementById("text-input");
    const speakFormEl = document.getElementById("speak-form");
    const submitBtnEl = document.getElementById("submit-btn");
    const targetSelectEl = document.getElementById("target-select");
    const emphasisSelectEl = document.getElementById("emphasis-select");
    const viewSelectEl = document.getElementById("view-select");
    const optionsSummaryTextEl = document.getElementById("options-summary-text");
    const captionApertureEl = document.getElementById("caption-aperture");
    const hudVoiceEl = document.getElementById("hud-voice");
    const hudBeaconEl = document.getElementById("hud-beacon");
    const hudProgressFillEl = document.getElementById("hud-progress-fill");
    const hudProgressTrackEl = document.getElementById("hud-progress-track");
    const hudPctEl = document.getElementById("hud-pct");
    const hudTimeEl = document.getElementById("hud-time");
    const audioPlayerEl = document.getElementById("audio-player");
    const playPauseBtnEl = document.getElementById("play-pause-btn");
    const terminalLogEl = document.getElementById("terminal-log");
    const terminalStatusBadgeEl = document.getElementById("terminal-status-badge");
    const outputsListEl = document.getElementById("outputs-list");
    const filesCountBadgeEl = document.getElementById("files-count-badge");
    const themeSelectEl = document.getElementById("theme-select");
    const cliRunnerSelectEl = document.getElementById("cli-runner-select");
    const parallaxToggleEl = document.getElementById("parallax-toggle");

    /* ── Visual-Only Theme & Parallax Depth Controls ────────────────── */
    function applyTheme(themeId, persist = true) {
      const resolved = themeId === "arcade" ? "arcade" : "lothal";
      state.theme = resolved;
      document.documentElement.dataset.theme = resolved;
      themeSelectEl.value = resolved;
      if (persist) {
        try { localStorage.setItem("speak-theme", resolved); } catch (_) {}
      }
    }

    function applyParallax(mode, persist = true) {
      const resolved = mode === "off" ? "off" : "on";
      state.parallax = resolved;
      document.documentElement.dataset.parallax = resolved;
      parallaxToggleEl.setAttribute("aria-pressed", resolved === "on" ? "true" : "false");
      if (persist) {
        try { localStorage.setItem("speak-parallax", resolved); } catch (_) {}
      }
    }

    themeSelectEl.addEventListener("change", () => applyTheme(themeSelectEl.value, true));
    parallaxToggleEl.addEventListener("click", () => {
      applyParallax(state.parallax === "on" ? "off" : "on", true);
    });

    window.addEventListener("scroll", () => {
      if (state.parallax === "on") {
        document.documentElement.style.setProperty("--scroll-y", `${window.scrollY}px`);
      }
    }, { passive: true });

    window.addEventListener("pointermove", (e) => {
      if (state.parallax === "on") {
        const cx = e.clientX - window.innerWidth / 2;
        const cy = e.clientY - window.innerHeight / 2;
        document.documentElement.style.setProperty("--mouse-x", `${cx}px`);
        document.documentElement.style.setProperty("--mouse-y", `${cy}px`);
      }
    }, { passive: true });

    applyTheme(state.theme, false);
    applyParallax(state.parallax, false);

    /* ── Options Summary Pill Updater ───────────────────────────────── */
    function updateOptionsSummary() {
      const tLabel = targetSelectEl.value === "browser" ? "Browser" : "Mac";
      const eLabel = emphasisSelectEl.options[emphasisSelectEl.selectedIndex]?.text || "Bold";
      const vLabel = viewSelectEl.options[viewSelectEl.selectedIndex]?.text || "Scroll";
      optionsSummaryTextEl.textContent = `${tLabel} · ${eLabel} · ${vLabel}`;
    }

    targetSelectEl.addEventListener("change", updateOptionsSummary);
    emphasisSelectEl.addEventListener("change", () => {
      state.emphasis = emphasisSelectEl.value;
      updateOptionsSummary();
      renderTeleprompterFrame(audioPlayerEl.currentTime || 0, audioPlayerEl.duration || 1);
    });
    viewSelectEl.addEventListener("change", () => {
      state.viewMode = viewSelectEl.value;
      captionApertureEl.className = `caption-viewport mode-${state.viewMode}`;
      updateOptionsSummary();
      renderTeleprompterFrame(audioPlayerEl.currentTime || 0, audioPlayerEl.duration || 1);
    });

    /* ── Markdown Cleaning & Per-Clause Timing Support ──────────────── */
    function cleanMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/^\s*```[^\n]*\n?/gm, "\n")
        .replace(/^\s*(?:[*_\-]\s*){3,}\s*$/gm, "\n")
        .replace(/(?:^|\s)\*{3,}(?:\s|$)/g, " ")
        .replace(/^\s*#{1,6}\s+(.+?)\s*#*$/gm, "$1:")
        .replace(/!\[([^\]]*)\]\([^)]+\)/g, "$1")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .replace(/\*{1,3}([^*\n]+?)\*{1,3}/g, "$1")
        .replace(/`+([^`\n]+?)`+/g, "$1")
        .replace(/\*+/g, "")
        .trim();
    }

    function estimateSyllables(w) {
      const clean = w.replace(/[^a-zA-Z]/g, "").toLowerCase();
      if (clean.length <= 3) return 1;
      const m = clean.match(/[aeiouy]+/g);
      return m ? Math.max(1, m.length) : 1;
    }

    function wrapWordsIntoLines(words, maxChars = 44) {
      const groups = [];
      let current = [];
      let curLen = 0;

      for (const w of words) {
        const wLen = w.length;
        if (current.length > 0 && curLen + 1 + wLen > maxChars) {
          groups.push(current);
          current = [w];
          curLen = wLen;
        } else {
          current.push(w);
          curLen += (current.length === 1 ? wLen : 1 + wLen);
          if (w.endsWith(".") || w.endsWith("!") || w.endsWith("?") || (curLen >= 18 && (w.endsWith(",") || w.endsWith(":") || w.endsWith(";")))) {
            groups.push(current);
            current = [];
            curLen = 0;
          }
        }
      }
      if (current.length > 0) groups.push(current);
      return groups;
    }

    function setTeleprompterTranscript(text, voiceId = "river", timingMeta = null) {
      const cleaned = cleanMarkdown(text || "");
      state.activeTranscript = cleaned;
      state.words = [];
      state.lineGroups = [];
      state.wordTimings = [];

      if (timingMeta && Array.isArray(timingMeta.clauses) && timingMeta.clauses.length > 0) {
        for (const c of timingMeta.clauses) {
          const cWords = (c.words && c.words.length) ? c.words : (c.text || "").split(/\s+/).filter(Boolean);
          if (!cWords.length) continue;
          const cStart = Number(c.start || 0);
          const cEnd = Number(c.speech_end ?? c.end ?? (cStart + 0.2));
          const cDur = Math.max(0.02, cEnd - cStart);

          const cLines = wrapWordsIntoLines(cWords, 44);
          state.lineGroups.push(...cLines);
          state.words.push(...cWords);

          const weights = cWords.map(estimateSyllables);
          const totW = weights.reduce((a, b) => a + b, 0) || 1;
          let tCursor = cStart;
          for (const wWeight of weights) {
            const wDur = cDur * (wWeight / totW);
            state.wordTimings.push([tCursor, tCursor + wDur]);
            tCursor += wDur;
          }
        }
      } else {
        state.words = cleaned.split(/\s+/).filter(Boolean);
        state.lineGroups = wrapWordsIntoLines(state.words, 44);
      }

      const persona = (state.schema?.personas || []).find(
        (p) => p.id.toLowerCase() === (voiceId || "").toLowerCase()
      );
      hudVoiceEl.textContent = (voiceId || "VOICE").toUpperCase();
      hudVoiceEl.style.color = persona ? persona.hex_color : "var(--c1-voice)";

      renderTeleprompterFrame(0, audioPlayerEl.duration || timingMeta?.total_duration || 1);
    }

    function findActiveWordPosition(elapsed, duration) {
      const totalWords = state.words.length;
      if (!totalWords || !state.lineGroups.length) return [0, 0];

      let currWordIdx = 0;
      if (state.wordTimings.length === totalWords) {
        for (let i = 0; i < totalWords; i++) {
          if (elapsed >= state.wordTimings[i][0]) {
            currWordIdx = i;
          } else {
            break;
          }
        }
      } else {
        const ratio = duration > 0 ? Math.min(1, Math.max(0, elapsed / duration)) : 0;
        currWordIdx = Math.min(totalWords - 1, Math.max(0, Math.floor(ratio * totalWords)));
      }

      let wordCounter = 0;
      for (let lIdx = 0; lIdx < state.lineGroups.length; lIdx++) {
        const lineWords = state.lineGroups[lIdx];
        if (wordCounter + lineWords.length > currWordIdx) {
          return [lIdx, currWordIdx - wordCounter];
        }
        wordCounter += lineWords.length;
      }
      const lastIdx = state.lineGroups.length - 1;
      return [lastIdx, state.lineGroups[lastIdx].length - 1];
    }

    function buildLineElement(lineWords, lineIdx, activeLineIdx, activeWordInLine) {
      const div = document.createElement("div");
      div.className = "caption-line";
      if (lineIdx < activeLineIdx) {
        div.classList.add("word-past");
        div.textContent = lineWords.join(" ");
      } else if (lineIdx > activeLineIdx) {
        div.classList.add("word-future");
        div.textContent = lineWords.join(" ");
      } else {
        lineWords.forEach((w, wIdx) => {
          const span = document.createElement("span");
          if (wIdx < activeWordInLine) span.className = "word-past";
          else if (wIdx === activeWordInLine) span.className = `word-active-${state.emphasis}`;
          else span.className = "word-future";
          span.textContent = w;
          div.appendChild(span);
          if (wIdx < lineWords.length - 1) div.appendChild(document.createTextNode(" "));
        });
      }
      return div;
    }

    function formatMMSS(sec) {
      if (!Number.isFinite(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function renderTeleprompterFrame(elapsed, duration) {
      captionApertureEl.innerHTML = "";

      if (!state.words.length || !state.lineGroups.length) {
        const empty = document.createElement("div");
        empty.className = "caption-line word-future";
        empty.textContent = "Ready.";
        captionApertureEl.appendChild(empty);
        return;
      }

      const [activeLineIdx, activeWordInLine] = findActiveWordPosition(elapsed, duration);

      if (state.viewMode === "scroll") {
        let activeEl = null;
        state.lineGroups.forEach((lineWords, idx) => {
          const el = buildLineElement(lineWords, idx, activeLineIdx, activeWordInLine);
          if (idx === activeLineIdx) activeEl = el;
          captionApertureEl.appendChild(el);
        });
        if (activeEl) {
          const topPos = activeEl.offsetTop - captionApertureEl.offsetTop - (captionApertureEl.clientHeight / 2) + (activeEl.clientHeight / 2);
          captionApertureEl.scrollTop = Math.max(0, topPos);
        }
      } else {
        const startLineIdx = activeLineIdx - 1;
        for (let slot = 0; slot < 3; slot++) {
          const targetIdx = startLineIdx + slot;
          if (targetIdx < 0 || targetIdx >= state.lineGroups.length) {
            const blank = document.createElement("div");
            blank.className = "caption-line";
            captionApertureEl.appendChild(blank);
          } else {
            captionApertureEl.appendChild(
              buildLineElement(state.lineGroups[targetIdx], targetIdx, activeLineIdx, activeWordInLine)
            );
          }
        }
      }

      const ratio = duration > 0 ? Math.min(1, Math.max(0, elapsed / duration)) : 0;
      const pct = Math.round(ratio * 100);
      hudProgressFillEl.style.width = `${pct}%`;
      hudPctEl.textContent = `${pct}%`;
      hudTimeEl.textContent = `${formatMMSS(elapsed)} / ${formatMMSS(duration)}`;
    }

    audioPlayerEl.addEventListener("play", () => {
      hudBeaconEl.textContent = "● PLAY";
      hudBeaconEl.className = "beacon-play";
      playPauseBtnEl.textContent = "⏸ Pause";
      requestAnimationFrame(stepTeleprompter);
    });

    audioPlayerEl.addEventListener("pause", () => {
      hudBeaconEl.textContent = "○ IDLE";
      hudBeaconEl.className = "beacon-idle";
      playPauseBtnEl.textContent = "▶ Play";
    });

    audioPlayerEl.addEventListener("ended", () => {
      hudBeaconEl.textContent = "● DONE";
      hudBeaconEl.className = "beacon-play";
      playPauseBtnEl.textContent = "▶ Play";
      renderTeleprompterFrame(audioPlayerEl.duration || 1, audioPlayerEl.duration || 1);
    });

    audioPlayerEl.addEventListener("timeupdate", () => {
      renderTeleprompterFrame(audioPlayerEl.currentTime, audioPlayerEl.duration || 1);
    });

    function stepTeleprompter() {
      if (!audioPlayerEl.paused) {
        renderTeleprompterFrame(audioPlayerEl.currentTime, audioPlayerEl.duration || 1);
        requestAnimationFrame(stepTeleprompter);
      }
    }

    hudProgressTrackEl.addEventListener("click", (e) => {
      if (!audioPlayerEl.duration) return;
      const rect = hudProgressTrackEl.getBoundingClientRect();
      const clickRatio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audioPlayerEl.currentTime = clickRatio * audioPlayerEl.duration;
      renderTeleprompterFrame(audioPlayerEl.currentTime, audioPlayerEl.duration);
    });

    playPauseBtnEl.addEventListener("click", () => {
      if (!audioPlayerEl.src) return;
      if (audioPlayerEl.paused) audioPlayerEl.play();
      else audioPlayerEl.pause();
    });

    textInputEl.addEventListener("keydown", (e) => {
      if (e.isComposing) return;
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        speakFormEl.requestSubmit();
      }
    });

    /* ── SSE Execution & Terminal Stream ────────────────────────────── */
    function appendLogLine(text, cls = "") {
      const div = document.createElement("div");
      div.className = `log-line ${cls}`.trim();
      div.textContent = text;
      terminalLogEl.appendChild(div);
      terminalLogEl.scrollTop = terminalLogEl.scrollHeight;
      return div;
    }

    let activeCrLineEl = null;

    async function executeAndStream(payload) {
      if (state.isRunning) return;
      state.isRunning = true;
      submitBtnEl.disabled = true;
      terminalStatusBadgeEl.textContent = "running...";
      activeCrLineEl = null;

      try {
        const resp = await fetch("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!resp.ok || !resp.body) {
          appendLogLine(`HTTP Error: ${resp.status}`, "done-err");
          terminalStatusBadgeEl.textContent = "error";
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split("\n\n");
          buffer = events.pop() || "";

          for (const rawEv of events) {
            const lines = rawEv.split("\n");
            let evType = "message";
            let dataStr = "";
            for (const l of lines) {
              if (l.startsWith("event:")) evType = l.slice(6).trim();
              else if (l.startsWith("data:")) dataStr += l.slice(5).trim();
            }
            if (!dataStr) continue;
            const data = JSON.parse(dataStr);

            if (evType === "start") {
              appendLogLine(`$ ${data.command}`, "cmd");
            } else if (evType === "output") {
              if (data.is_cr) {
                if (!activeCrLineEl) activeCrLineEl = appendLogLine(data.line, "cr");
                else activeCrLineEl.textContent = data.line;
              } else {
                activeCrLineEl = null;
                appendLogLine(data.line);
              }
            } else if (evType === "done") {
              activeCrLineEl = null;
              if (data.exit_code === 0) {
                terminalStatusBadgeEl.textContent = "exit 0";
                appendLogLine("✓ exit 0", "done-ok");
                if (data.output) {
                  setTeleprompterTranscript(
                    data.output.transcript || textInputEl.value,
                    data.output.voice,
                    data.output.timing
                  );
                  audioPlayerEl.src = data.output.url;
                  audioPlayerEl.play().catch(() => {});
                  await loadOutputs();
                }
              } else {
                terminalStatusBadgeEl.textContent = `exit ${data.exit_code}`;
                appendLogLine(`✗ exit ${data.exit_code}`, "done-err");
              }
            }
          }
        }
      } catch (err) {
        terminalStatusBadgeEl.textContent = "error";
        appendLogLine(`Error: ${err.message}`, "done-err");
      } finally {
        state.isRunning = false;
        submitBtnEl.disabled = false;
      }
    }

    /* ── Schema Introspection & Pulldown Population ─────────────────── */
    function populateVoicesForEngine(engineId) {
      if (!state.schema) return;
      voiceSelectEl.innerHTML = "";
      const available = state.schema.personas.filter((p) =>
        p.realizations.includes(engineId)
      );

      for (const p of available) {
        const opt = document.createElement("option");
        opt.value = p.id;
        opt.textContent = `${p.glyph} ${p.name} — ${p.style}`;
        if (p.id === state.selectedVoice) opt.selected = true;
        voiceSelectEl.appendChild(opt);
      }

      if (voiceSelectEl.selectedIndex === -1 && available.length > 0) {
        const riverOpt = available.find((p) => p.id === "river");
        voiceSelectEl.value = riverOpt ? "river" : available[0].id;
      }
      updateVoiceMeta();
    }

    function updateVoiceMeta() {
      if (!state.schema) return;
      const vId = voiceSelectEl.value;
      state.selectedVoice = vId;
      const p = state.schema.personas.find((item) => item.id === vId);
      if (p) {
        const rDetail = p.realization_details?.[state.selectedEngine];
        const rVoice = rDetail?.voice || (rDetail?.blend ? "blend" : state.selectedEngine);
        voiceMetaEl.textContent = `${state.selectedEngine} → ${rVoice}`;
        hudVoiceEl.textContent = p.name.toUpperCase();
        hudVoiceEl.style.color = p.hex_color;
      }
    }

    async function loadSchema() {
      const resp = await fetch("/api/schema");
      const schema = await resp.json();
      state.schema = schema;

      document.getElementById("schema-badge").textContent =
        `${schema.engines.length}e · ${schema.personas.length}v`;

      state.selectedEngine = schema.user_config?.engine || "kokoro";
      state.selectedVoice = schema.user_config?.persona || "river";
      if (schema.user_config?.emphasis) {
        state.emphasis = schema.user_config.emphasis;
        emphasisSelectEl.value = state.emphasis;
      }
      if (schema.user_config?.view) {
        state.viewMode = schema.user_config.view;
        viewSelectEl.value = state.viewMode;
        captionApertureEl.className = `caption-viewport mode-${state.viewMode}`;
      }
      updateOptionsSummary();

      engineSelectEl.innerHTML = "";
      for (const eng of schema.engines) {
        const opt = document.createElement("option");
        opt.value = eng.id;
        opt.textContent = `${eng.id} (${eng.label})`;
        if (eng.id === state.selectedEngine) opt.selected = true;
        engineSelectEl.appendChild(opt);
      }

      populateVoicesForEngine(state.selectedEngine);

      tagInsertSelectEl.innerHTML = '<option value="">+ [tag] ▾</option>';
      for (const tag of schema.help.audio_tags || []) {
        const opt = document.createElement("option");
        opt.value = tag;
        opt.textContent = tag;
        tagInsertSelectEl.appendChild(opt);
      }

      setTeleprompterTranscript(textInputEl.value, state.selectedVoice);
    }

    engineSelectEl.addEventListener("change", () => {
      state.selectedEngine = engineSelectEl.value;
      populateVoicesForEngine(state.selectedEngine);
    });

    voiceSelectEl.addEventListener("change", updateVoiceMeta);

    tagInsertSelectEl.addEventListener("change", () => {
      const tag = tagInsertSelectEl.value;
      if (!tag) return;
      const start = textInputEl.selectionStart || 0;
      const end = textInputEl.selectionEnd || 0;
      const val = textInputEl.value;
      textInputEl.value = `${val.slice(0, start)}${tag} ${val.slice(end)}`;
      tagInsertSelectEl.value = "";
      textInputEl.focus();
    });

    cliRunnerSelectEl.addEventListener("change", () => {
      const cmd = cliRunnerSelectEl.value;
      if (!cmd) return;
      cliRunnerSelectEl.value = "";
      document.getElementById("terminal-details").open = true;
      executeAndStream({
        mode: "subcommand",
        subcommand_args: cmd.split(/\s+/),
      });
    });

    speakFormEl.addEventListener("submit", (e) => {
      e.preventDefault();
      const formErr = document.getElementById("form-error");
      formErr.style.display = "none";
      formErr.textContent = "";

      const useClipboard = document.getElementById("flag-clipboard").checked;
      const textVal = textInputEl.value.trim();
      if (!useClipboard && !textVal) {
        formErr.textContent = "Enter text or enable -c Clip.";
        formErr.style.display = "block";
        textInputEl.focus();
        return;
      }

      executeAndStream({
        mode: "narrate",
        engine: state.selectedEngine,
        voice: voiceSelectEl.value,
        text: textVal,
        clipboard: useClipboard,
        raw: document.getElementById("flag-raw").checked,
        playback_target: targetSelectEl.value,
      });
    });

    document.getElementById("clear-log-btn").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      terminalLogEl.innerHTML = "";
      terminalStatusBadgeEl.textContent = "cleared";
    });

    async function loadOutputs() {
      const resp = await fetch("/api/outputs");
      const data = await resp.json();
      outputsListEl.innerHTML = "";
      const list = data.outputs || [];
      filesCountBadgeEl.textContent = `${list.length} wav`;

      if (list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "file-sub";
        empty.textContent = "No saved .wav files yet.";
        outputsListEl.appendChild(empty);
        return;
      }

      for (const item of list) {
        const row = document.createElement("div");
        row.className = "file-row";

        const info = document.createElement("div");
        info.className = "file-info";

        const title = document.createElement("div");
        title.className = "file-title";
        title.textContent = `${item.voice ? item.voice.toUpperCase() + " · " : ""}${item.duration_seconds}s · ${item.filename}`;

        const sub = document.createElement("div");
        sub.className = "file-sub";
        sub.textContent = item.transcript || item.created_at;

        info.appendChild(title);
        info.appendChild(sub);

        const actions = document.createElement("div");
        actions.className = "file-actions";

        const playBtn = document.createElement("button");
        playBtn.type = "button";
        playBtn.className = "btn-mini";
        playBtn.style.minHeight = "32px";
        playBtn.style.borderColor = "var(--c6-files)";
        playBtn.textContent = "▶";
        playBtn.title = "Play in Player";
        playBtn.addEventListener("click", () => {
          if (item.transcript) {
            textInputEl.value = item.transcript;
          }
          setTeleprompterTranscript(
            item.transcript || textInputEl.value,
            item.voice || state.selectedVoice,
            item.timing
          );
          audioPlayerEl.src = item.url;
          audioPlayerEl.play();
        });

        const dl = document.createElement("a");
        dl.href = item.url;
        dl.download = item.filename;
        dl.className = "link-dl";
        dl.textContent = "⬇";
        dl.title = "Download WAV";

        actions.appendChild(playBtn);
        actions.appendChild(dl);

        row.appendChild(info);
        row.appendChild(actions);
        outputsListEl.appendChild(row);
      }
    }

    document.getElementById("refresh-outputs-btn").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      loadOutputs();
    });

    loadSchema();
    loadOutputs();
  </script>
</body>
</html>
