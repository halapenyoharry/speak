# voices.yaml — persona registry for the `speak` TTS CLI
#
# A "persona" is the substrate-independent identity the user requests (e.g. `puck`).
# Each persona declares zero-or-more "realizations": how a specific engine renders it.
# A realization is PRESENT IFF its engine key exists under `realizations`.
# THERE IS NO FALLBACK KEY AND NO DEFAULT REALIZATION. If the active engine has no
# realization for the requested persona, the driver MUST hard-error and name the
# engines that DO realize it — never substitute, never fall back to a "nearest" voice.
#
# Engine config-values: gemini | gcloud | kokoro | bark
#   gemini : {voice: <Name>}                    — Gemini AI Studio prebuilt voice
#   gcloud : {voice: en-US-Chirp3-HD-<Name>, language_code: en-US}
#   kokoro : EITHER {voice: <id>} OR {blend: [{voice: <id>, weight: <w>}, ...]}  (never both)
#            blend weights auto-normalize in the adapter (they need not sum to 1).
#   bark   : {voice: <preset>}                  — Suno Bark speaker preset (e.g. v2/en_speaker_6)
#
# !!! gcloud VOICE-NAME VERIFICATION REQUIRED !!!
# The `en-US-Chirp3-HD-<Name>` names below are constructed mechanically from the
# Gemini persona names. They are NOT guaranteed to exist in Google Cloud's live
# Chirp 3 HD voice catalogue. Before trusting any gcloud realization, verify the
# name against the live list:
#   gcloud ml speech ...  /  GET texttospeech.googleapis.com/v1/voices?languageCode=en-US
# Any name not in that list will fail at synthesis time (that is correct: missing
# realization is a hard error, not a fallback). Prune or correct names as verified.
#
# kokoro realizations exist ONLY for the 9 personas that kokoro_tts.py historically
# mapped. The other 21 personas honestly have NO offline realization and OMIT the
# kokoro key entirely — requesting them under `--engine kokoro` is a hard error.

default_persona: puck

